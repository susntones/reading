# NexT Theme Configuration
# Docs: https://theme-next.js.org/

# Scheme
scheme: Gemini

# Dark Mode
darkmode: true

# Menu
menu:
  home: / || fa fa-home
  archives: /archives/ || fa fa-archive
  categories: /categories/ || fa fa-th
  tags: /tags/ || fa fa-tags
  书单: /booklists/fagu-jinjin/ || fa fa-book
  about: /about/ || fa fa-user

# Sidebar
sidebar:
  position: left
  display: post
  padding: 18
  offset: 12

# Avatar
avatar:
  url: /images/avatar.jpg
  rounded: true
  rotated: false

# Social Links
social:
  GitHub: https://github.com || fab fa-github

# Posts
post_meta:
  created_at: true
  updated_at:
    enable: true
    another_day: true
  categories: true

# Reading Progress
reading_progress:
  enable: true
  position: top
  color: "#37c6c0"
  height: 3px

# Bookmark
bookmark:
  enable: true
  color: "#222"
  save: auto

# Table of Contents (TOC)
toc:
  enable: true
  number: true
  wrap: false
  expand_all: false
  max_depth: 4

# Code Block
codeblock:
  copy_button:
    enable: true
    style: mac

# Back to Top
back2top:
  enable: true
  sidebar: false
  scrollpercent: true

# Font
font:
  enable: true
  global:
    external: true
    family: Noto Serif SC
    size: 1.0
  headings:
    external: true
    family: Noto Serif SC
  posts:
    external: true
    family: Noto Serif SC

# Local Search
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 1
  unescape: false
  preload: false

# Tag icon
tag_icon: true

# Post word count
symbols_count_time:
  separated_meta: true
  item_text_total: true

# Creative Commons
creative_commons:
  license: by-nc-sa
  size: small
  sidebar: true
  post: true
  language: zh-CN

# Related Posts
related_posts:
  enable: true

# Footer
footer:
  since: 2024
  icon:
    name: fa fa-book
    animated: false
    color: "#808080"
  powered: true
